name: Sync Upstream

on:
  schedule:
    - cron: "0 0 * * 0" # Run weekly on Sunday at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Alpha
          fetch-depth: 0

      - name: Sync upstream changes
        id: sync
        uses: aormber/Fork-Sync-With-Upstream-action@v1.4.1
        with:
          target_sync_branch: Alpha
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_branch: Alpha
          upstream_sync_repo: MetaCubeX/mihomo
          test_branch_name: sync-upstream-${{ github.run_id }}
          test_mode: true

      - name: Create Pull Request
        if: steps.sync.outputs.has_new_commits == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sync-upstream-${{ github.run_id }}
          base: Alpha
          title: "chore: sync upstream changes from MetaCubeX/mihomo"
          body: |
            Automated PR to sync changes from upstream repository.

            Upstream: MetaCubeX/mihomo (Alpha branch)
          labels: sync-upstream
