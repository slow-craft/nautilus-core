name: Sync Upstream

on:
  schedule:
    - cron: "0 0 * * 0" # Run weekly on Sunday at midnight UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Alpha
          fetch-depth: 0

      - name: Get latest upstream tag
        id: upstream_tag
        run: |
          LATEST_TAG=$(git ls-remote --tags --sort=-v:refname https://github.com/MetaCubeX/mihomo.git | head -n1 | sed 's/.*refs\/tags\///')
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream tag: $LATEST_TAG"

      - name: Check if tag exists locally
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.upstream_tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.upstream_tag.outputs.tag }} already exists locally"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.upstream_tag.outputs.tag }} is new"
          fi

      - name: Merge upstream Meta into sync branch
        if: steps.check_tag.outputs.exists == 'false'
        id: sync
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git remote add upstream https://github.com/MetaCubeX/mihomo.git
          git fetch upstream Meta

          if git merge-base --is-ancestor upstream/Meta HEAD; then
            echo "Upstream Meta is already merged; nothing to do."
            echo "has_new_commits=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          BRANCH_NAME=sync-upstream-${{ steps.upstream_tag.outputs.tag }}
          git checkout -b "$BRANCH_NAME"
          git merge upstream/Meta --no-edit -m "chore: merge upstream Meta ${{ steps.upstream_tag.outputs.tag }}"
          echo "has_new_commits=true" >> $GITHUB_OUTPUT

      - name: Set up Go
        if: steps.check_tag.outputs.exists == 'false' && steps.sync.outputs.has_new_commits == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Apply rebrand rewrite to synced files
        if: steps.check_tag.outputs.exists == 'false' && steps.sync.outputs.has_new_commits == 'true'
        run: |
          set -euo pipefail
          find . -type f \( -name "*.go" -o -name "go.mod" -o -name "*.proto" -o -name "*.nix" \) \
            ! -path "./.git/*" -print0 \
            | xargs -0 sed -i 's|github.com/metacubex/mihomo|github.com/slow-craft/nautilus-core|g'
          gofmt -w .

          if git diff --quiet; then
            echo "No rebrand changes needed."
          else
            git add -A
            git commit -m "chore: apply rebrand rewrite after upstream sync"
          fi

      - name: Push sync branch
        if: steps.check_tag.outputs.exists == 'false' && steps.sync.outputs.has_new_commits == 'true'
        run: |
          git push origin sync-upstream-${{ steps.upstream_tag.outputs.tag }}

      - name: Create Pull Request
        if: steps.check_tag.outputs.exists == 'false' && steps.sync.outputs.has_new_commits == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base Alpha \
            --head sync-upstream-${{ steps.upstream_tag.outputs.tag }} \
            --title "chore: sync upstream ${{ steps.upstream_tag.outputs.tag }}" \
            --label sync-upstream \
            --body "$(cat <<'EOF'
          Automated PR to sync changes from upstream repository.

          Upstream: MetaCubeX/mihomo (Meta branch)
          New tag: ${{ steps.upstream_tag.outputs.tag }}

          > ⚠️ Auto rebrand rewrite has been applied (\`github.com/metacubex/mihomo\` → \`github.com/slow-craft/nautilus-core\`).
          > Please verify \`go build ./...\` passes before merging.
          EOF
          )"
